name: Reusable Swift package
on:
  workflow_call:
permissions:
  contents: read
jobs:
  swift:
    name: Swift build and test
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.2-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify package and tests exist
        run: |
          test -f Package.swift
          test -f Package.resolved
          test -d Tests
          test -n "$(find Tests -name '*.swift' -print -quit)"
      - name: Build with resolved dependencies
        run: swift build --force-resolved-versions
      - name: Test with resolved dependencies
        run: swift test --force-resolved-versions
